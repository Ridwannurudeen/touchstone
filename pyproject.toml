[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone"
version = "0.1.0"
description = "Evidence-backed controls for real-world asset disclosures"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cryptography==50.0.0",
    # A runtime dependency, not a test one, and the distinction is the whole point.
    # `process_identity` reads `/proc/<pid>/stat` and falls back to psutil; with neither it
    # degrades to `<pid>:unknown`, and `verify` turns that into "the process identity could
    # not be established on this platform" -- a reason, so `daemon_alive` is False forever.
    # Declaring psutil dev-only therefore made the tests healthy while leaving liveness
    # permanently broken on every shipped install without procfs. The heartbeat would report
    # a dead daemon on a machine whose daemon was fine, which is the exact failure the
    # heartbeat exists to detect and so the worst possible place to be wrong.
    "psutil==7.2.2",
    "web3==7.16.0",
]

[project.optional-dependencies]
dev = [
    # Imported directly by tests/test_deployment_manifests.py. It was undeclared and only
    # ever present because unrelated packages on one developer machine happened to install
    # it -- web3 does not. A clean install would have failed at import, which is the kind of
    # thing the repository had no CI to notice.
    "jsonschema==4.26.0",
    # Imported by `scripts/build_docs.py` and, through it, `scripts/build_project_state.py`
    # -- which CI runs as the canonical-truth gate. Undeclared for the same reason as its
    # neighbours: present on the authoring machine by accident, so every local run passed
    # while the first clean environment to try it failed on import. Third instance of this
    # defect; the comment pattern above exists because it keeps happening.
    "markdown==3.10.2",
    "pytest==8.3.3",
    # Read by `scripts/assert_ci_gates.py`, which checks the CI workflow covers every job.
    # It was importable on this machine only because a dozen unrelated packages had pulled
    # it in -- the same accident that hid `jsonschema` and `psutil`, found the same way.
    "pyyaml==6.0.3",
    "ruff==0.15.22",
]

[tool.setuptools]
# Declared, not discovered. Setuptools' flat-layout auto-discovery found `data`, `fixtures`,
# `contracts`, `manifests` and `deployments` sitting beside `touchstone` and refused to build
# at all -- so `pip install -e .` had never once succeeded. Nothing noticed, because every
# test run so far started in the repository root, where `touchstone` imports from the working
# directory whether it is installed or not. The first clean install was the first honest test
# of that, and this is what it found.
packages = ["touchstone", "touchstone.normalize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_e2e: starts and stops its own local Hardhat node on an ephemeral port",
]

[tool.ruff]
target-version = "py311"
line-length = 88
