[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone"
version = "0.1.0"
description = "Evidence-backed controls for real-world asset disclosures"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cryptography==49.0.0",
    "web3==7.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_e2e: starts and stops its own local Hardhat node on an ephemeral port",
]

[tool.ruff]
target-version = "py311"
line-length = 88
