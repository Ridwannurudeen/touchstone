server {
    listen 80;
    listen [::]:80;
    server_name touchstone.gudman.xyz;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 predates the `http2 on;` directive, so the option rides on the
    # listen directive here as it does in every other vhost on this host.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name touchstone.gudman.xyz;

    ssl_certificate /etc/letsencrypt/live/touchstone.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/touchstone.gudman.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/touchstone-site;
    index index.html;

    # `script-src 'none'` is not a hardening afterthought here, it is the claim the
    # site makes about itself. Every page is a static rendering of a signed bundle a
    # reader can download and check offline, so the page must not be able to compute
    # anything on their behalf. If a script is ever introduced, this fails closed and
    # the contradiction surfaces immediately instead of shipping quietly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The font filenames carry no hash, but the families change only when the design
    # does, so a year is safe.
    #
    # The security headers are repeated rather than inherited: an `add_header`
    # anywhere in a location block drops every `add_header` set above it, so naming
    # only Cache-Control here would quietly serve the fonts without HSTS or nosniff.
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # The published bundle is the point of the site: a reader downloads it and
    # verifies the report offline. It must arrive as bytes to save, not as something
    # a browser tries to render, and it must never be cached long — a later epoch
    # adds files here and a stale index would misrepresent what has been published.
    location /data/ {
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Clean URLs: `/dossier` serves `dossier.html`, `/dossier/ustb-2026-08-17` serves
    # `dossier/ustb-2026-08-17.html`. `$uri.html` is tried before `$uri/` so a page
    # and a directory of the same name resolve to the page, which is what the nav
    # links to — `/dossier` is the index, and the directory beside it holds epochs.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
