name: Live public and on-chain truth

on:
  workflow_dispatch:

permissions: {}

env:
  PYTHONUTF8: "1"

jobs:
  live_public_truth:
    name: compare repository facts with live status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # This is deliberately outside push CI: a push checks the new repository before it is
      # deployed. A mismatch here must still fail because this job measures deployed drift.
      - run: python scripts/check_public_truth.py

  onchain_registry_truth:
    name: compare repository publications with registries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/check_onchain_truth.py
