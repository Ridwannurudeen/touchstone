name: Live public truth

on:
  workflow_dispatch:

permissions: {}

env:
  PYTHONUTF8: "1"

jobs:
  live_public_truth:
    name: compare repository facts with live status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_public_truth.py
